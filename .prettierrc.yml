---
singleQuote: true
tabWidth: 2
bracketSpacing: true
arrowParens: avoid
semi: true
printWidth: 120
htmlWhitespaceSensitivity: strict
bracketSameLine: true
trailingComma: none
overrides:
  - files:
      # by default package.json have 2 spaces
      - 'package.json'
    options:
      tabWidth: 2
  - files:
      # markdown uses 4-space indentation (matches .editorconfig and vim ftplugin)
      - '*.md'
    options:
      tabWidth: 4
